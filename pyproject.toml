[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-rag"
version = "0.1.0"
description = "Hybrid RAG for insurance knowledge retrieval on Amazon Bedrock + OpenSearch"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4",
  "boto3>=1.35",
  "opensearch-py>=2.7,<3",
  "redis>=5.0,<7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
# PDF parsing for the ingestion job (not needed in the API image)
ingestion = ["pymupdf>=1.24", "pymupdf4llm>=0.0.17"]
# Langfuse tracing (enabled at runtime with RAG_LANGFUSE_ENABLED=true)
observability = ["langfuse>=3.0,<4"]
# Ragas evaluation (CI only)
# Ragas imports modules that newer LangChain releases removed, so these pins are required
# (verified together: imports resolve and metric names match ragas_scorer.py).
eval = [
  "ragas>=0.3,<0.4",
  "langchain-aws>=0.2,<0.3",
  "langchain-core>=0.3,<0.4",
  "langchain-community>=0.3,<0.4",
  "langchain-openai<0.4",
]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-redis"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insurance_rag = ["evaluation/*.yaml", "evaluation/*.jsonl", "ingestion/*.yaml"]
"insurance_rag.prompts_data" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
